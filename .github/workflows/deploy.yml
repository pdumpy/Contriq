name: Deploy Contriq

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contriq-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the Worker
        run: npm run build:vinext
      - name: Apply and verify Supabase migrations
        run: npm run db:release
        env:
          CONTRIQ_RELEASE_DATABASE_URL: ${{ secrets.CONTRIQ_RELEASE_DATABASE_URL }}
          CONTRIQ_RELEASE_DATABASE_CA: ${{ secrets.CONTRIQ_RELEASE_DATABASE_CA }}
      - name: Deploy the Worker
        run: npm exec -- cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the public app
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors --max-time 15 'https://contriq-oswarteck.pdumpy.workers.dev/api/health'
          curl --fail --silent --show-error --max-time 20 'https://contriq-oswarteck.pdumpy.workers.dev/' --output /dev/null
